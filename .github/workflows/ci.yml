# PlaneSpotter CI. Author CKC. Version 0.1.0.
# Phase S gate work runs against real services and is not represented here.
# This workflow proves the repo is internally consistent, nothing more.

name: ci

on:
  push:
    branches: [main, 'phase-*', 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Registration prefix drift
        run: pnpm run prefixes:check

      - name: Design token drift
        run: pnpm run tokens:check

      - name: Tests
        run: pnpm run test

      - name: No committed env files
        run: pnpm run env:check
